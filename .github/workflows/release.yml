name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            if printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE" &&
              keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
              echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            else
              rm -f "$KEYSTORE_FILE"
              echo "::warning::Release signing credentials are invalid or incomplete; building unsigned artifacts."
              echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            fi
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Orion-${GITHUB_REF_NAME}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/Orion-${GITHUB_REF_NAME}-release.aab"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Orion-${GITHUB_REF_NAME}-release-unsigned.apk"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Orion $GITHUB_REF_NAME" \
            --generate-notes

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
